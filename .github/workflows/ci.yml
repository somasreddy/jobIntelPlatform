name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Report bundle size
        # Working-directory for this job defaults to "frontend" (see `defaults` above),
        # so .next here is frontend/.next relative to the repo root.
        # Not fail-worthy yet - just surfacing the number in logs/summary so growth
        # is visible over time.
        run: |
          echo "### Frontend build size (.next)" >> "$GITHUB_STEP_SUMMARY"
          du -sh .next | tee -a "$GITHUB_STEP_SUMMARY"

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # continue-on-error is intentional: a prior review already surfaced 7
      # high-severity transitive findings that have not been triaged yet.
      # Failing the whole pipeline on those before anyone has reviewed them
      # would block unrelated PRs. Remove continue-on-error once the existing
      # findings are triaged (fixed, upgraded, or explicitly accepted).
      - name: Audit frontend dependencies (npm audit)
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit

      # continue-on-error: same rationale as the frontend audit step above -
      # report findings without blocking CI until they've been triaged.
      - name: Audit backend dependencies (pip-audit)
        run: pip-audit -r backend/requirements.txt
        continue-on-error: true

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the action can diff against the base/previous commit
          # instead of only the checked-out snapshot.
          fetch-depth: 0

      - name: Scan for leaked secrets (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown

  # NOTE (followup, not yet actionable): an "e2e" job (Playwright) was intentionally
  # not added in this pass. As of this run, frontend/playwright.config.ts and
  # frontend/e2e/ do not exist in the working tree, and guessing at a config that
  # doesn't match what another in-flight change actually produces would be worse
  # than skipping it. Once those land, add a job here modeled on the "frontend"
  # job's checkout/setup-node steps, then:
  #   - name: Install Playwright browsers
  #     run: npx playwright install --with-deps chromium
  #   - name: Run e2e tests
  #     run: npm run test:e2e
